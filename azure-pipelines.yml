trigger:
  branches:
    include:
    - master
stages:
- stage: __default
  jobs:
  - job: Job
    pool:
      name: 'Swarit'
    steps:
    - task: Bash@3
      displayName: 'Download sca-resolver'
      inputs:
        targetType: 'inline'
        script: |
          wget https://sca-downloads.s3.amazonaws.com/cli/2.12.34/ScaResolver-linux64.tar.gz

    - task: Bash@3
      displayName: 'Extract sca-resolver'
      inputs:
        targetType: 'inline'
        script: |
          tar -xzvf ScaResolver-linux64.tar.gz

    - task: Bash@3
      displayName: 'Remove tar file'
      inputs:
        targetType: 'inline'
        script: |
          rm -f ScaResolver-linux64.tar.gz
    - task: Checkmarx AST@3
      inputs:
        CheckmarxService: 'swarit_creds'
        projectName: '00252150-ADO-CLI-SCAResolver'
        branchName: 'main'
        tenantName: 'cx_seg'
        additionalParams: ''